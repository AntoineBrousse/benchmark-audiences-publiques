name: Benchmark mensuel

on:
  schedule:
    - cron: "17 6 2 * *"   # le 2 de chaque mois, 6h17 UTC (le SIG publie le 1er)
  workflow_dispatch:
    inputs:
      mois:
        description: "Mois à traiter (AAAA-MM). Vide = dernier mois publié"
        required: false

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calcul du benchmark
        run: |
          if [ -n "${{ inputs.mois }}" ]; then
            python scripts/benchmark.py --mois "${{ inputs.mois }}"
          else
            python scripts/benchmark.py
          fi
      - name: Qualité technique (Lighthouse)
        continue-on-error: true   # un échec Lighthouse ne bloque pas le benchmark d'audience
        run: python scripts/lighthouse.py
      - name: Enregistrement des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add resultats/
          git diff --cached --quiet && echo "Aucun changement" && exit 0
          git commit -m "Benchmark $(date +%Y-%m-%d)"
          git push
